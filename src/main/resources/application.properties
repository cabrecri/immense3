spring.application.name=people-api

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:peopledb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# run data.sql AFTER Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# H2 web console -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API key required in the X-API-Key header on every request except the H2 console.
# Set the PEOPLE_API_KEY environment variable before starting the app.
app.security.api-key=${PEOPLE_API_KEY}
